---
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
#    network_mode: host
    runtime: nvidia
    environment:
      - PUID=3000
      - PGID=3000
      - TZ=Canada/Atlantic
      - VERSION=latest
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
#      - PLEX_CLAIM=
    volumes:
      - /docker/appdata/plex/library:/config
      - /data/media:/tv
      - /data/media:/movies
    restart: unless-stopped
    networks:
      server-macvlan:
        ipv4_address: 10.69.69.20
networks:
  server-macvlan:
    external: true
    name: server-macvlan
