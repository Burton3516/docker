---
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    runtime: nvidia
    environment:
      - PUID=3000
      - PGID=3000
      - TZ=Canada/Atlantic
      - VERSION=latest
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/nvidia/current
#      - PLEX_CLAIM=
    volumes:
      - /docker/appdata/plex/library:/config
      - /data/media:/tv
      - /data/media:/movies
    restart: unless-stopped

  tautulli:
    image: ghcr.io/tautulli/tautulli
    container_name: tautulli
    restart: unless-stopped
    volumes:
      - /docker/appdata/tautulli:/config
    environment:
      - PUID=3002
      - PGID=3000
      - TZ=Canada/Atlantic
    ports:
      - 8181:8181
