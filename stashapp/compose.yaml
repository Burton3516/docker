services:
  stash:
    image: stashapp/stash:latest
    container_name: stash
    restart: unless-stopped
    ports:
      - "9999:9999"
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"
    environment:
      - PUID=3003
      - PGID=3003
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_PORT=9999
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/stashapp/config:/root/.stash
      - /data/other/Scripts:/data
      - /docker/appdata/stashapp/metadata:/metadata
      - /docker/appdata/stashapp/cache:/cache
      - /docker/appdata/stashapp/blobs:/blobs
      - /docker/appdata/stashapp/generated:/generated
  stash-vr:
    image: ofl0w/stash-vr:latest
    container_name: stash-vr
    restart: unless-stopped
    ports:
      - "9666:9666"
    environment:
      STASH_GRAPHQL_URL: "http://10.69.69.10:9999/graphql"
      #STASH_API_KEY: "xxx"
      FAVORITE_TAG: "FAVORITE"

      ## FILTERS can be either 'frontpage' or a comma separated list of filter ids.
      ## If left empty all saved filters will be shown.
      #FILTERS: "2,3,7"     # comma separated list of filter ids to show
      #FILTERS: "frontpage" # show only scene filters from front page

      ALLOW_SYNC_MARKERS: "true"
      #HEATMAP_HEIGHT_PX: 45
      #DISABLE_PLAY_COUNT: "true"
      #EVENT_SERVER_URL: "http://192.168.0.127:8099":"

      #LOG_LEVEL: "debug"
      #DISABLE_LOG_COLOR: "true"

      #FORCE_HTTPS: "true"
