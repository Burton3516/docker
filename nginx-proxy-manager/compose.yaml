services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /docker/appdata/nginx-proxy/data:/data
      - /docker/appdata/nginx-proxy/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
